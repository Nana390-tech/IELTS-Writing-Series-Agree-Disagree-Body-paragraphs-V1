<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IELTS Writing Task 2: Idea Builder</title>
<style>
:root{--p:#1c1c1c;--pd:#000000;--a:#ffcc00;--ai:#1a1400;--bg:#faf8f0;--soft:#fdf3c9;--ok:#1f8a4c;--bad:#cc3322;--ag:#4a7a12;--dg:#a32020}
*{box-sizing:border-box}
html{font-size:19px}
body{margin:0;background:var(--bg);color:#1d2430;font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;line-height:1.6}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.ar{direction:rtl;text-align:right;font-family:Tahoma,"Segoe UI","Noto Naskh Arabic",Arial,sans-serif;color:#5b6474;font-size:.95rem;margin:.2rem 0 .6rem}
.small{font-size:.85rem;color:#5b6474}
.top{position:sticky;top:0;z-index:20;background:var(--pd);color:#fff;display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center;justify-content:space-between;padding:.6rem 1.1rem}
.brand{display:flex;flex-direction:column;line-height:1.25}
.series{font-size:.78rem;opacity:.82}
.ltitle{font-size:1.1rem;font-weight:700}
.tools{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.pill{background:var(--a);color:var(--ai);font-weight:700;border-radius:999px;padding:.15rem .8rem;font-size:.85rem;white-space:nowrap}
.pill.ghost{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.5)}
.tbtn{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.5);border-radius:8px;padding:.1rem .65rem;font-size:.82rem}
.tbtn:hover{background:rgba(255,255,255,.14)}
#rail{display:flex;gap:.35rem;overflow-x:auto;padding:.7rem 1.1rem;background:#fff;border-bottom:1px solid #e4e0d2}
.rs{flex:1 0 auto;min-width:112px;display:flex;align-items:center;gap:.45rem;border:2px solid #e8e4d6;background:#fff;border-radius:10px;padding:.3rem .55rem;text-align:left;color:#1d2430}
.rs .n{flex:none;width:1.7rem;height:1.7rem;border-radius:50%;display:grid;place-items:center;background:#f3efdf;font-weight:700;font-size:.82rem}
.rs .t{display:flex;flex-direction:column;line-height:1.15;font-size:.84rem;font-weight:600}
.rs .t small{font-weight:400;color:#6b7383;font-family:Tahoma,Arial,sans-serif}
.rs.on{border-color:var(--p);background:var(--soft)}
.rs.ok{border-color:var(--a)}
.rs.on .n{background:var(--p);color:#fff}
.rs.ok .n{background:var(--a);color:var(--ai)}
main{max-width:960px;margin:0 auto;padding:1.3rem 1rem 2rem}
footer{text-align:center;color:#6b7383;font-size:.85rem;padding:1.2rem 1rem 2rem}
.card{background:#fff;border:1px solid #e4e0d2;border-radius:14px;padding:1.1rem 1.3rem;margin-bottom:1rem}
.card h2{margin:0 0 .4rem;font-size:1.45rem;color:var(--pd)}
h3{color:var(--pd);font-size:1.15rem;margin:1.1rem 0 .5rem}
.hero{display:grid;grid-template-columns:auto 1fr;gap:0 1.3rem;align-items:start;margin:.3rem 0 1.2rem}
.hero .mark{font-size:3.2rem;line-height:1}
.hero h1{margin:.1rem 0 .3rem;font-size:1.9rem;color:var(--pd);line-height:1.2}
.hero p{margin:0}
.btn{background:var(--p);color:#fff;border:0;border-radius:10px;padding:.55rem 1.2rem;font-weight:700}
.btn:hover{background:var(--pd)}
.btn.ghost{background:#fff;color:var(--pd);border:2px solid var(--p)}
.btn.ghost:hover{background:var(--soft)}
.btn.go{background:var(--a);color:var(--ai)}
.btn.go:hover{background:#e6b800}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;margin-top:.8rem}
.navrow{display:flex;justify-content:space-between;gap:1rem;margin-top:1.3rem}
.qbox{background:var(--soft);border:2px solid var(--p);border-radius:12px;padding:.75rem 1rem;margin:.6rem 0}
.qbox .h{font-weight:800;color:var(--pd);margin-bottom:.2rem;font-size:.9rem}
.qbox p{margin:.2rem 0}
.angles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.5rem;margin-top:.6rem}
.angle{border:2px solid #e4e0d2;border-radius:10px;padding:.45rem .7rem;background:#fff;text-align:left}
.angle b{color:var(--p);display:block;font-size:.95rem}
.angle span{font-size:.85rem;color:#5b6474}
.chain{display:grid;gap:.5rem;margin:.6rem 0}
.link{display:grid;grid-template-columns:7.5rem 1fr;gap:.8rem;align-items:start}
.link .lab{font-weight:800;font-size:.85rem;color:#fff;background:var(--p);border-radius:8px;padding:.25rem .5rem;text-align:center}
.link .lab.r{background:#4d4d4d}.link .lab.e{background:var(--a);color:var(--ai)}.link .lab.l{background:#6b7383}
.link .txt{background:#fff;border:1px solid #e4e0d2;border-radius:10px;padding:.4rem .8rem}
.item{display:grid;grid-template-columns:2.2rem 1fr;gap:.8rem;background:#fff;border:1px solid #e4e0d2;border-radius:14px;padding:1rem 1.2rem;margin-bottom:.9rem}
.item.done{border-color:var(--p)}
.qnum{width:2.2rem;height:2.2rem;border-radius:50%;background:var(--soft);color:var(--pd);font-weight:800;display:grid;place-items:center}
.item.done .qnum{background:var(--p);color:#fff}
.q{margin:.1rem 0 .6rem;font-size:1.02rem;font-weight:600}
.opts{display:grid;gap:.5rem}
.opt{text-align:left;background:#fff;border:2px solid #ded9c7;border-radius:10px;padding:.5rem .8rem;color:#1d2430}
.opt:hover:not([disabled]){border-color:var(--p);background:var(--soft)}
.opt.right{border-color:var(--ok);background:#e9f7ee;font-weight:700}
.opt.wrong{border-color:var(--bad);background:#fdeae7;text-decoration:line-through;color:#8a3b3b}
.fb{margin-top:.7rem;border-radius:10px;padding:.55rem .8rem;font-size:.94rem}
.fb.ok{background:#e9f7ee;border-left:5px solid var(--ok)}
.fb.no{background:#fdeae7;border-left:5px solid var(--bad)}
.hint{font-size:.85rem;color:#5b6474;margin:-.3rem 0 .5rem}
.bank{display:flex;flex-wrap:wrap;gap:.5rem;min-height:2.4rem;margin-bottom:.7rem}
.tile{background:#fff;border:2px solid var(--p);color:var(--pd);border-radius:9px;padding:.35rem .7rem;font-weight:600;text-align:left;max-width:100%}
.tile.sel{background:var(--p);color:#fff}
.buckets{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.bucket{border:2px dashed var(--p);border-radius:12px;padding:.55rem;background:var(--soft);text-align:left;min-height:5rem;color:#1d2430;display:flex;flex-direction:column;gap:.3rem}
.bucket>b{color:var(--pd);font-size:.9rem}
.bucket .placed{background:#fff;border-radius:7px;padding:.2rem .5rem;font-size:.85rem;border-left:4px solid var(--a)}
.bucket.flashbad{border-color:var(--bad);background:#fdeae7}
.match{display:grid;grid-template-columns:1fr 1fr;gap:.5rem 1rem}
.match .col{display:flex;flex-direction:column;gap:.5rem}
.mt{background:#fff;border:2px solid #ded9c7;border-radius:10px;padding:.45rem .7rem;text-align:left;color:#1d2430}
.mt.sel{border-color:var(--p);background:var(--soft);font-weight:700}
.mt.paired{border-color:var(--ok);background:#e9f7ee}
.line{min-height:3rem;border:2px dashed var(--p);border-radius:10px;padding:.45rem;display:grid;gap:.4rem;margin-bottom:.6rem;background:var(--soft)}
.line:empty::before{content:"Tap the sentences below in the right order";color:#6b7383;font-size:.9rem}
/* brainstorm */
.sides{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:.7rem}
.side{border:2px solid #e4e0d2;border-radius:12px;padding:.7rem .85rem;background:#fff;border-top-width:6px}
.side.ag{border-top-color:var(--ag)}
.side.dg{border-top-color:var(--dg)}
.side h4{margin:0 0 .4rem;font-size:1rem;color:var(--pd)}
.side.ag h4{color:var(--ag)}.side.dg h4{color:var(--dg)}
.idea{display:grid;grid-template-columns:1.6rem 1fr;gap:.4rem;align-items:center;margin-bottom:.45rem}
.idea textarea{width:100%;border:2px solid #ded9c7;border-radius:9px;padding:.35rem .6rem;font-size:.95rem;resize:none;overflow:hidden;line-height:1.45;font-family:inherit}
.idea textarea:focus{border-color:var(--p);outline:none}
.idea input[type=radio]{width:1.15rem;height:1.15rem;accent-color:var(--p)}
.deep{border:2px solid var(--p);border-radius:12px;padding:.7rem .9rem;margin-top:.7rem;background:#fffdf4}
.deep .lab{font-weight:700;font-size:.9rem;color:var(--pd);margin-top:.4rem}
.deep textarea{width:100%;border:2px solid #ded9c7;border-radius:9px;padding:.4rem .6rem;font-size:.97rem;margin-top:.2rem;resize:none;overflow:hidden;line-height:1.5;font-family:inherit}
.deep textarea:focus{border-color:var(--p);outline:none}
.plan{background:var(--soft);border-radius:12px;padding:.6rem .9rem;margin:.6rem 0;font-size:.95rem}
textarea.body{width:100%;min-height:9rem;border:2px solid #ded9c7;border-radius:12px;padding:.7rem;font-size:1.02rem;line-height:1.7;resize:vertical;overflow:hidden}
textarea.body:focus{border-color:var(--p);outline:none}
.wrap2{display:grid;gap:1rem}
.report{display:grid;gap:.4rem;margin-top:.6rem}
.chk{display:grid;grid-template-columns:1.8rem 1fr;gap:.6rem;border:1px solid #e4e0d2;border-radius:10px;padding:.4rem .7rem;background:#fff;font-size:.93rem}
.chk.pass{border-color:var(--ok);background:#f3fbf6}
.chk.fail{border-color:var(--bad);background:#fdf4f3}
.chk .ic{text-align:center;font-weight:800}
.modelbox{background:#fffdf4;border:2px solid var(--a);border-radius:12px;padding:.7rem 1rem;margin-top:.7rem;line-height:1.8}
mark.key{background:transparent;color:var(--pd);font-weight:700;border-bottom:3px solid var(--a)}
.lk{border-bottom:3px dotted #9a7400;color:#7a5c00;font-weight:600}
.bigscore{display:flex;align-items:baseline;gap:1rem;margin:.4rem 0 .8rem}
.bigscore span{font-size:3.2rem;font-weight:800;color:var(--pd);line-height:1}
#cert{position:fixed;inset:0;background:rgba(20,18,5,.65);z-index:50;display:grid;place-items:center;padding:1rem}
#cert[hidden]{display:none}
.cert-card{background:#fff;max-width:740px;width:100%;border:10px solid var(--p);outline:3px solid var(--a);outline-offset:-22px;border-radius:6px;padding:2.2rem 2rem;text-align:center}
.cert-card h2{font-size:2.1rem;margin:.2rem 0;color:var(--pd)}
.cert-card .who{font-size:1.9rem;font-weight:800;color:var(--p);border-bottom:3px solid var(--a);display:inline-block;padding:0 1rem;margin:.5rem 0}
.cert-actions{margin-top:1.1rem;display:flex;gap:.6rem;justify-content:center}
#toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%) translateY(150%);background:var(--pd);color:#fff;padding:.6rem 1.2rem;border-radius:12px;font-weight:600;z-index:60;transition:transform .3s,opacity .3s;opacity:0;pointer-events:none;max-width:90vw}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70;width:100%;height:100%}
#printview{display:none}
@media print{
 body{background:#fff}
 body.printing>*:not(#cert){display:none!important}
 body.printing #cert{position:static}
 body.printing .cert-actions{display:none}
 .cert-card{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 body.printwork>*:not(#printview){display:none!important}
 body.printwork #printview{display:block;padding:0}
}
#printview h1{font-size:1.5rem;color:var(--pd);margin:0 0 .2rem}
#printview h2{font-size:1.1rem;color:var(--pd);border-bottom:2px solid var(--a);padding-bottom:.15rem;margin:1rem 0 .4rem}
#printview .meta{font-size:.9rem;color:#444;margin-bottom:.6rem}
#printview .pq{border:1px solid #888;border-radius:6px;padding:.4rem .6rem;margin-bottom:.5rem}
#printview .cols{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
#printview ul{margin:.2rem 0 .4rem 1.1rem;padding:0}
#printview .para{border:1px solid #888;border-radius:6px;padding:.5rem .7rem;margin-bottom:.5rem;line-height:1.7;white-space:pre-wrap}
#printview .lines{border:1px solid #888;border-radius:6px;height:5.5rem;margin-top:.2rem}
#printview .rep{font-size:.9rem}
#printview .rep .f{color:#a32020}
@media (max-width:700px){.sides,.buckets,.match{grid-template-columns:1fr}.hero{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="series">IELTS Writing Task 2</span><span class="ltitle">Idea Builder: both sides, two paragraphs</span></div>
  <div class="tools">
    <span class="pill" id="score">0 / 0</span>
    <span class="pill ghost" id="statepill">No topic chosen</span>
    <button class="tbtn" data-act="printwork">Print</button>
    <button class="tbtn" data-act="save">Save</button>
    <button class="tbtn" data-act="load">Load</button>
    <input type="file" id="file" accept=".json,application/json" hidden>
  </div>
</header>
<nav id="rail" aria-label="Steps"></nav>
<main id="main"></main>
<footer>Designed by: Nazila Motahari</footer>
<div id="printview"></div>
<div id="cert" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<script>
const ANGLES=[
 {k:"Money",q:"Does it cost money or save money? For students, families or the government?"},
 {k:"Time",q:"Does it save time or waste time? Whose time?"},
 {k:"Health",q:"Does it affect physical health, sleep or mental health?"},
 {k:"Learning",q:"Does it help people learn, or does it distract them?"},
 {k:"Jobs",q:"Does it help people get work, or take work away?"},
 {k:"Fairness",q:"Who benefits? Is anyone left out?"},
 {k:"Safety",q:"Does it make people safer or put them at risk?"},
 {k:"Environment",q:"Does it affect pollution, traffic or waste?"},
 {k:"Family",q:"How does it change life at home?"},
 {k:"Freedom",q:"Does it give people more choice, or less?"}];

const TOPICS=[
{id:"t1",t:"Phones in class",q:"Students should be allowed to use their mobile phones in class. To what extent do you agree or disagree?",
 keys:["phones","phone","class","students","school","lessons"],
 agree:[{i:"Phones are useful learning tools",r:"students can find information and check words in seconds",e:"a learner who meets a new word can look it up before the teacher moves on"},
   {i:"Phones prepare students for digital work",r:"most jobs now need people to use apps, documents and online meetings",e:"an engineering student who uses design apps at school finds office software easy later"},
   {i:"Phones help students who learn slowly",r:"recordings and photos of the board can be reviewed at home",e:"a student who misses an explanation can watch it again that evening"}],
 disagree:[{i:"Phones break concentration",r:"messages and games interrupt a task every few minutes",e:"a student who checks social media during a reading task has to start the text again"},
   {i:"Phones make cheating easy",r:"answers can be searched or shared silently during a test",e:"a photo of a test paper can reach the whole class in seconds"},
   {i:"Phones harm the atmosphere of the class",r:"students talk to screens instead of to each other",e:"group work becomes silent when everyone is looking down"}],
 model:[
  "((Firstly)), I believe that phones should be allowed, [[because]] they are powerful learning tools. Students can check the meaning of a new word, find a fact or join an online quiz in seconds, [[which means that]] a lesson is never held up by one unknown term. [[For example]], a learner who does not understand a question in a reading task can find a simple explanation immediately, without waiting for the teacher to reach her desk. ((In addition)), using these tools at school prepares young people for workplaces where almost every task involves a screen. ((Therefore)), in my view, a ban would remove a useful resource from the classroom.",
  "((On the other hand)), those who disagree argue that phones break concentration. ((They point out that)) teenagers receive messages and notifications every few minutes, [[so]] their attention is broken again and again and they lose the thread of the lesson. [[For instance]], a student who checks social media in the middle of a reading task usually has to start the text from the beginning. ((In addition)), they argue that phones make cheating far easier, [[since]] answers can be photographed and shared silently during a test. ((For these reasons)), many teachers prefer to collect phones at the door."]},
{id:"t2",t:"Free university",q:"University education should be free for everyone. To what extent do you agree or disagree?",
 keys:["university","free","education","students","fees","tuition"],
 agree:[{i:"Free study opens university to poorer families",r:"talent is spread across all income levels but money is not",e:"a strong student from a low-income family can study medicine instead of leaving school at eighteen"},
   {i:"Graduates pay the country back later",r:"they earn more and pay higher taxes for the rest of their lives",e:"a qualified engineer returns the cost of the course many times over"},
   {i:"Students can focus on studying",r:"nobody has to work night shifts to pay fees",e:"a student who does not work twenty hours a week has time to prepare properly for exams"}],
 disagree:[{i:"Free places are paid for by everyone",r:"taxes rise for people who never attend university",e:"a shop worker pays for courses her own children may never take"},
   {i:"Free study can lower quality",r:"money is spread thinly across more students",e:"crowded lecture halls and fewer staff mean less feedback on writing"},
   {i:"Students may value it less",r:"a course that costs nothing can be abandoned easily",e:"drop-out rates rise when there is no financial reason to finish"}],
 model:[
  "((Firstly)), I believe that university should be free, [[because]] fees stop talented students from poorer families. Ability is spread across every income group, [[but]] money is not, [[so]] a high fee closes the door on students who would succeed. [[For example]], a strong student whose parents cannot afford tuition may leave education at eighteen, although she could have become a doctor. ((Secondly)), graduates repay the cost through taxes for the rest of their working lives, [[which means that]] free places are an investment rather than a gift.",
  "((On the other hand)), those who disagree argue that free study is paid for by the whole population, including people who never attend university. ((They also point out that)) when the same budget is divided between far more students, quality falls, [[because]] lecture halls become crowded and teachers have less time for feedback. [[For instance]], a class of three hundred cannot receive the detailed comments that a class of thirty receives. ((Finally)), they argue that courses which cost nothing are abandoned more easily, [[since]] students lose no money by walking away. ((For these reasons)), they prefer low fees with scholarships."]},
{id:"t3",t:"Working from home",q:"Employees should be allowed to work from home whenever their job allows it. To what extent do you agree or disagree?",
 keys:["work","home","employees","office","working"],
 agree:[{i:"Remote work saves hours of travel",r:"the daily commute disappears",e:"an employee who saves ninety minutes a day gains a full working week each month"},
   {i:"It helps people with families",r:"parents can be at home when children return from school",e:"a mother can finish a report after the school run instead of leaving the office early"},
   {i:"Fewer cars means less pollution",r:"rush-hour traffic falls when offices are half empty",e:"cities reported cleaner air during periods of remote working"}],
 disagree:[{i:"Teamwork is harder at a distance",r:"quick conversations and small questions disappear",e:"a problem solved in two minutes beside a colleague's desk becomes a chain of emails"},
   {i:"New staff learn less",r:"young employees copy the people around them",e:"a graduate in her first job has nobody to watch when she works alone at home"},
   {i:"Home is not always a workplace",r:"many homes are small, noisy or shared",e:"an employee in a crowded flat has no quiet corner for a video meeting"}],
 model:[
  "((Firstly)), I believe that employees should be allowed to work from home, [[because]] the daily commute takes hours from their week. An hour or more each day goes to traffic instead of work, family or sleep, [[so]] removing it makes people both calmer and more productive. [[For example]], a worker who saves ninety minutes a day gains the equivalent of a full working week every month. ((In addition)), remote work suits parents, [[since]] they can be at home when their children arrive from school and still finish their tasks in the evening.",
  "((On the other hand)), those who disagree argue that teams work better in the same room. ((They point out that)) quick questions and short conversations disappear at a distance, [[so]] a problem solved in two minutes beside a colleague becomes a long chain of emails. [[For instance]], a graduate in her first job has nobody to watch and copy when she works alone at home. ((In addition)), they argue that not every home is suitable for work, [[because]] many are small, noisy or shared with a large family. ((For these reasons)), many managers prefer a fixed number of office days."]},
{id:"t4",t:"Fast food advertising",q:"Advertisements for fast food should be banned. To what extent do you agree or disagree?",
 keys:["fast","food","advertising","advertisements","banned","adverts"],
 agree:[{i:"Adverts target children",r:"young viewers cannot judge what is healthy",e:"a cartoon character on a packet makes a child ask for that meal"},
   {i:"Obesity costs the health system",r:"treating diet-related illness takes money from other care",e:"hospitals spend heavily on diabetes that began with daily fast food"},
   {i:"Bans have worked before",r:"tobacco advertising was banned and smoking fell",e:"countries that banned cigarette adverts saw fewer young smokers"}],
 disagree:[{i:"Adults can choose for themselves",r:"a ban treats grown people like children",e:"a customer who eats well all week can still choose a burger on Friday"},
   {i:"Advertising supports jobs and sport",r:"restaurants, media and clubs depend on that money",e:"many local tournaments are paid for by food companies"},
   {i:"Education works better than banning",r:"people need to understand food, not simply see fewer posters",e:"cooking lessons at school change habits for life"}],
 model:[
  "((Firstly)), I believe that fast food advertising should be banned, [[because]] it targets children who cannot judge what is healthy. Bright colours and cartoon characters make a meal look like a toy, [[so]] a child asks for it long before understanding what sugar and fat do. [[For example]], an advert shown during a children`s programme can decide what a whole family eats for breakfast. ((Secondly)), diet-related illness is expensive for the health system, [[which means that]] the cost of these adverts is paid by everyone through taxes.",
  "((On the other hand)), those who disagree argue that adults are able to decide for themselves and that a ban treats grown people like children. [[For instance]], a customer who eats well all week can reasonably choose a burger on a Friday evening. ((In addition)), they point out that advertising money supports restaurants, television channels and local sports clubs, [[so]] a ban would damage businesses that have nothing to do with health. ((Finally)), they argue that education changes habits more effectively than prohibition, [[because]] people who understand food make better choices."]},
{id:"t5",t:"Free public transport",q:"Public transport should be free for everyone in large cities. To what extent do you agree or disagree?",
 keys:["public","transport","free","cities","buses","metro"],
 agree:[{i:"Free transport cuts traffic and pollution",r:"drivers leave their cars when the bus costs nothing",e:"cities with free buses report fewer cars in the centre at rush hour"},
   {i:"It helps people on low incomes",r:"transport is a large part of a small salary",e:"a cleaner travelling two hours a day saves a significant amount each month"},
   {i:"It makes the city work better",r:"people reach jobs, hospitals and colleges more easily",e:"a student can accept a course on the other side of the city"}],
 disagree:[{i:"Someone still pays",r:"the cost moves from passengers to taxpayers",e:"a resident who never uses the metro pays for it through local taxes"},
   {i:"Free services can get worse",r:"crowding rises while the budget for repairs stays the same",e:"buses become too full at peak times and arrive late"},
   {i:"Cheaper is not the main problem",r:"people avoid buses because they are slow, not expensive",e:"a journey that takes three times longer than driving is refused at any price"}],
 model:[
  "((Firstly)), I believe that public transport should be free, [[because]] it would take thousands of cars off the road. When a journey costs nothing, drivers choose the metro instead, [[so]] traffic and carbon emissions fall together. [[For example]], several cities that removed fares reported noticeably fewer vehicles in the centre at rush hour. ((In addition)), the policy helps people on low incomes, [[since]] transport takes a large share of a small salary. [[For instance]], a cleaner who travels two hours a day would save a significant amount every month.",

  ${S.showBank?`<div class="sides" style="margin-top:.6rem">

    <div class="side dg"><h4>Ideas that disagree</h4>${t.disagree.map(x=>`<p class="small"><b>${esc(x.i)}</b><br>because ${esc(x.r)}<br><i>For example, ${esc(x.e)}</i></p>`).join("")}</div></div>
    <p class="small">Use these only to check your thinking. Your own ideas are always better in the exam.</p>`:""}
  <p style="margin-top:.7rem">Write two or three ideas on each side. Short notes are fine.</p>
  <div class="sides">${sideHTML("a")}${sideHTML("d")}</div>
  <h3>Angles that help</h3>
  <div class="angles">${ANGLES.slice(0,6).map(x=>`<div class="angle"><b>${esc(x.k)}</b><span>${esc(x.q)}</span></div>`).join("")}</div>
  <h3>Now deepen the two ideas you ticked</h3>
  ${["a","d"].map(side=>{const ch=chosen(side);
    return `<div class="deep"><b style="color:var(--${side==="a"?"ag":"dg"})">${side==="a"?"AGREE":"DISAGREE"} idea:</b> ${ch?esc(ch):"<span class='small'>Tick an idea above first.</span>"}
    <div class="lab">Reason — why is it true?</div><textarea rows="1" class="grow" data-deep="${side}" data-f="r" placeholder="because …">${esc(S.deep[side].r)}</textarea>
    <div class="lab">Example — one specific situation</div><textarea rows="1" class="grow" data-deep="${side}" data-f="e" placeholder="For example, …">${esc(S.deep[side].e)}</textarea></div>`;}).join("")}
  <div class="row"><button class="btn go" data-act="go" data-s="write">Write the two paragraphs</button></div>
  ${brainOK()?"":`<p class="small">You need two ideas on each side, one ticked on each side, and a reason and example for both.</p>`}</section>`;
}
function pWrite(){
  const t=T(),C=S.checked?[checkBody(0),checkBody(1)]:null;
  const plan=side=>{const ch=chosen(side);return `<div class="plan"><b>${side==="a"?"Paragraph 1 — my own ideas":"Paragraph 2 — the ideas of those who disagree"}</b><br>
    Idea: ${ch?esc(ch):"<i>not chosen</i>"}<br>Reason: ${esc(S.deep[side].r)||"<i>—</i>"}<br>Example: ${esc(S.deep[side].e)||"<i>—</i>"}</div>`;};
  return `<section class="card"><h2>Write your two body paragraphs</h2>
  <div class="qbox"><div class="h">Topic</div><p>${esc(t.q)}</p>
   <p class="small"><b>Paragraph 1:</b> your ideas, reasons and examples, joined with Firstly, Secondly, In addition. <b>Paragraph 2:</b> the reasons of those who disagree, reported fairly. 80 to 120 words each.</p></div>
  ${brainOK()?"":`<div class="fb no">Finish the brainstorm first: two ideas per side, one ticked, with a reason and an example.</div>`}
  <div class="wrap2">
   <div>${plan("a")}<textarea class="body" data-body="0" placeholder="Firstly, I believe that…">${esc(S.bodies[0])}</textarea>
    <div class="small">${wc(S.bodies[0])} words</div>${C?`<div class="report">${C[0].map(c=>`<div class="chk ${c.ok?"pass":"fail"}"><div class="ic">${c.ok?"✓":"✗"}</div><div><b>${esc(c.t)}</b>${c.ok?"":"<br><span class='small'>"+esc(c.no)+"</span>"}</div></div>`).join("")}</div>`:""}</div>
   <div>${plan("d")}<textarea class="body" data-body="1" placeholder="On the other hand, those who disagree argue that…">${esc(S.bodies[1])}</textarea>
    <div class="small">${wc(S.bodies[1])} words</div>${C?`<div class="report">${C[1].map(c=>`<div class="chk ${c.ok?"pass":"fail"}"><div class="ic">${c.ok?"✓":"✗"}</div><div><b>${esc(c.t)}</b>${c.ok?"":"<br><span class='small'>"+esc(c.no)+"</span>"}</div></div>`).join("")}</div>`:""}</div>
  </div>
  <div class="row"><button class="btn go" data-act="check">Check my paragraphs</button>
   <button class="btn ghost" data-act="model">${S.showModel?"Hide":"Show"} model paragraphs</button></div>
  ${S.showModel?`<div class="modelbox"><b>Model paragraphs for this topic</b>${t.model.map(m=>`<p>${mk(m)}</p>`).join("")}
   <p class="small"><mark class="key">Underlined</mark> = explanation and example language. <span class="lk">Dotted</span> = linking words.</p></div>`:""}
  </section>`;
}
function pFinish(){
  const ok=bothPass(),ready=ok&&pct()>=80,t=T();
  return `<section class="card"><h2>Finish</h2>
  <div class="bigscore"><span>${pct()}%</span><div><b>${score()} of ${MAX} activity points</b><br>
   <span class="small">Paragraph 1: ${bodyPass(0)?"all checks passed":"not finished"} · Paragraph 2: ${bodyPass(1)?"all checks passed":"not finished"}</span></div></div>
  ${ready?`<div class="fb ok"><b>Well done.</b> You have a brainstorm and two body paragraphs that cover both sides.</div>
    <div class="row"><label>Your name <input id="nm" value="${esc(S.name)}" style="border:2px solid #d2d9ea;border-radius:10px;padding:.35rem .6rem"></label><button class="btn" data-act="cert">Create certificate</button></div>`
   :`<div class="fb no">For the certificate you need 80% in the activities (${pct()}% so far) and both paragraphs passing every check.</div>`}
  <div class="row"><button class="btn ghost" data-act="download">Download my work</button>
   <button class="btn ghost" data-act="save">Save progress file</button>
   <button class="btn ghost" data-act="again">New topic, keep my score</button></div></section>
  <section class="card"><h2>What comes next</h2>
  <p>You now have the two body paragraphs. Add the four-move introduction and a conclusion that repeats your opinion in new words, and you have a complete essay.</p>
  <p class="small">Topic used: ${esc(t.q)}</p></section>`;
}
/* events */
function reItem(k){const el=$("#it-"+k);if(el){const n=el.querySelector(".qnum").textContent;el.innerHTML=itemHTML(k,n);}checkDone();}
function flashEl(sel){const e=$(sel);if(e){e.classList.add("flashbad");setTimeout(()=>e.classList.remove("flashbad"),450);}}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,k=b.dataset.k;
  if(a==="go")return go(b.dataset.s);
  if(a==="mc"){const r=st(k),o=+b.dataset.o;if(r.done)return;r.tried.push(o);
    if(o===ITEMS[k].a){r.done=true;r.pts=r.tried.length===1?10:0;if(r.pts)confetti(25);}reItem(k);return;}
  if(a==="spick"){st(k).sel=+b.dataset.i;reItem(k);return;}
  if(a==="sdrop"){const r=st(k),it=ITEMS[k],bi=+b.dataset.b;if(r.sel==null||r.done)return;
    if(it.items[r.sel].b===bi){r.placed[r.sel]=bi;r.sel=null;
      if(Object.keys(r.placed).length===it.items.length){r.done=true;r.pts=Math.round(10*(it.items.length-r.bad.length)/it.items.length);confetti(40);}reItem(k);}
    else{if(!r.bad.includes(r.sel))r.bad.push(r.sel);flashEl(`#it-${k} .bucket[data-b="${bi}"]`);}
    return;}
  if(a==="ml"){st(k).sel=+b.dataset.i;reItem(k);return;}
  if(a==="mr"){const r=st(k),it=ITEMS[k],i=+b.dataset.i;if(r.sel==null||r.done)return;
    if(i===r.sel){r.m[i]=true;r.sel=null;if(Object.keys(r.m).length===it.pairs.length){r.done=true;r.pts=Math.round(10*(it.pairs.length-r.bad.length)/it.pairs.length);confetti(40);}reItem(k);}
    else{if(!r.bad.includes(r.sel))r.bad.push(r.sel);flashEl(`#it-${k} .mt[data-act="mr"][data-i="${i}"]`);}
    return;}
  if(a==="oadd"){const r=st(k);if(r.done)return;r.ans.push(+b.dataset.i);r.wrong=false;reItem(k);return;}
  if(a==="oback"){const r=st(k);if(r.done)return;r.ans=r.ans.filter(x=>x!==+b.dataset.i);reItem(k);return;}
  if(a==="ocheck"){const r=st(k),it=ITEMS[k];r.checks++;
    if(r.ans.map(i=>it.tiles[i]).join(" ")===it.tiles.join(" ")){r.done=true;r.pts=r.checks===1?10:0;if(r.pts)confetti(25);}else r.wrong=true;
    reItem(k);return;}
  if(a==="oshow"){const r=st(k);r.ans=ITEMS[k].tiles.map((_,i)=>i);r.done=true;r.pts=0;reItem(k);return;}
  if(a==="nexttopic"){if((S.ideas.a.join("")+S.ideas.d.join("")+S.bodies.join("")).trim()&&!confirm("Change topic? Your brainstorm and paragraphs will be cleared."))return;
    S.ti=(S.ti+1)%TOPICS.length;S.ideas={a:["","",""],d:["","",""]};S.pick={a:null,d:null};S.deep={a:{r:"",e:""},d:{r:"",e:""}};
    S.bodies=["",""];S.checked=false;S.showBank=false;S.showModel=false;S.done.brain=false;S.done.write=false;render();return;}
  if(a==="bank"){S.showBank=!S.showBank;render();return;}
  if(a==="check"){if(wc(S.bodies[0])<20&&wc(S.bodies[1])<20){toast("Write your paragraphs first.");return;}
    S.checked=true;render();if(bothPass())confetti(140);checkDone();return;}
  if(a==="model"){S.showModel=!S.showModel;render();return;}
  if(a==="again"){if(!confirm("Start a new topic? Your activity score stays, but the brainstorm and paragraphs are cleared."))return;
    S.ti=(S.ti+1)%TOPICS.length;S.ideas={a:["","",""],d:["","",""]};S.pick={a:null,d:null};S.deep={a:{r:"",e:""},d:{r:"",e:""}};
    S.bodies=["",""];S.checked=false;S.showBank=false;S.showModel=false;S.done.brain=false;S.done.write=false;cur="brain";render();return;}
  if(a==="cert")return cert();
  if(a==="print"){document.body.classList.add("printing");window.print();setTimeout(()=>document.body.classList.remove("printing"),500);return;}
  if(a==="closecert"){$("#cert").hidden=true;return;}
  if(a==="printwork")return printWork();
  if(a==="download")return download();
  if(a==="save")return saveFile();
  if(a==="load")return $("#file").click();
});
document.addEventListener("input",e=>{const t=e.target;
  if(t.tagName==="TEXTAREA"&&(t.classList.contains("grow")||t.classList.contains("body")))grow(t);
  if(t.dataset.idea!==undefined){S.ideas[t.dataset.idea][+t.dataset.i]=t.value;save();checkDone();return;}
  if(t.dataset.deep!==undefined){S.deep[t.dataset.deep][t.dataset.f]=t.value;save();checkDone();return;}
  if(t.dataset.body!==undefined){S.bodies[+t.dataset.body]=t.value;
    const lab=t.parentElement.querySelector(".small");if(lab)lab.textContent=wc(t.value)+" words";save();return;}
  if(t.id==="nm"){S.name=t.value;save();return;}});
document.addEventListener("change",e=>{const t=e.target;
  if(t.dataset.pick!==undefined){S.pick[t.dataset.pick]=+t.dataset.i;render();checkDone();}});
/* files */
function dl(name,text,type){const b=new Blob([text],{type:type||"text/plain;charset=utf-8"});const a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function download(){
  const t=T(),L=["IELTS Writing Task 2 — brainstorm and body paragraphs","Name: "+(S.name||"____________"),"Date: "+new Date().toLocaleDateString("en-GB"),"",
   "TOPIC","-".repeat(60),t.q,"","BRAINSTORM","-".repeat(60),
   "Agree ideas:",...S.ideas.a.filter(Boolean).map((x,i)=>"  "+(i+1)+". "+x),
   "Disagree ideas:",...S.ideas.d.filter(Boolean).map((x,i)=>"  "+(i+1)+". "+x),"",
   "Chosen agree idea: "+chosen("a"),"  Reason: "+S.deep.a.r,"  Example: "+S.deep.a.e,
   "Chosen disagree idea: "+chosen("d"),"  Reason: "+S.deep.d.r,"  Example: "+S.deep.d.e,"",
   "BODY PARAGRAPH 1 ("+wc(S.bodies[0])+" words)","-".repeat(60),S.bodies[0],"",
   "BODY PARAGRAPH 2 ("+wc(S.bodies[1])+" words)","-".repeat(60),S.bodies[1],"","CHECKS","-".repeat(60)];
  [0,1].forEach(n=>{L.push("Paragraph "+(n+1)+":");checkBody(n).forEach(c=>L.push((c.ok?"  [ok]  ":"  [fix] ")+c.t+(c.ok?"":" — "+c.no)));});
  dl("Task2-brainstorm-and-paragraphs.txt",L.join("\n"));toast("Downloaded. Hand the file to your teacher if she asks for it.");}
function printWork(){
  const t=T(),C=[checkBody(0),checkBody(1)],d=new Date().toLocaleDateString("en-GB");
  const list=side=>{const arr=S.ideas[side].filter(x=>x.trim());return arr.length?"<ul>"+arr.map((x,i)=>`<li>${esc(x)}${S.pick[side]===S.ideas[side].indexOf(x)?" <b>(chosen)</b>":""}</li>`).join("")+"</ul>":"<p>—</p>";};
  const para=(n,txt)=>txt.trim()?`<div class="para">${esc(txt)}</div><p class="rep">${wc(txt)} words · `+
    C[n].map(c=>`<span class="${c.ok?"":"f"}">${c.ok?"✓":"✗"} ${esc(c.t)}</span>`).join(" · ")+`</p>`
    :`<div class="lines"></div><p class="rep">Not written yet.</p>`;
  $("#printview").innerHTML=`<h1>IELTS Writing Task 2 — brainstorm and body paragraphs</h1>
   <p class="meta">Name: ${esc(S.name)||"__________________"} &nbsp; Class: __________ &nbsp; Date: ${d}</p>
   <div class="pq"><b>Topic:</b> ${esc(t.q)}</div>
   <h2>Brainstorm</h2>
   <div class="cols"><div><b>Reasons to agree</b>${list("a")}</div><div><b>Reasons to disagree</b>${list("d")}</div></div>
   <div class="cols"><div><b>Chosen agree idea:</b> ${esc(chosen("a"))||"—"}<br>Reason: ${esc(S.deep.a.r)||"—"}<br>Example: ${esc(S.deep.a.e)||"—"}</div>
   <div><b>Chosen disagree idea:</b> ${esc(chosen("d"))||"—"}<br>Reason: ${esc(S.deep.d.r)||"—"}<br>Example: ${esc(S.deep.d.e)||"—"}</div></div>
   <h2>Body paragraph 1 — my own ideas</h2>${para(0,S.bodies[0])}
   <h2>Body paragraph 2 — the ideas of those who disagree</h2>${para(1,S.bodies[1])}
   <h2>Teacher comments</h2><div class="lines"></div>
   <p class="meta">Designed by: Nazila Motahari</p>`;
  document.body.classList.add("printwork");
  window.print();
  setTimeout(()=>document.body.classList.remove("printwork"),600);
  toast("Printing your work. Empty parts print as blank boxes you can fill in by hand.");
}
function saveFile(){dl("Idea-Builder-progress.json",JSON.stringify(S,null,1),"application/json");toast("Progress saved to your downloads.");}
$("#file").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!("ideas" in o))throw 0;S=Object.assign(fresh(),o);cur=S.step||"learn";render();toast("Progress loaded.");}
  catch(err){alert("This file could not be read. Choose a progress file saved from this app.");}};
  r.readAsText(f);e.target.value="";});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function load(){try{const s=localStorage.getItem(KEY);if(!s)return false;const o=JSON.parse(s);if(!o||!("ideas" in o))return false;
  S=Object.assign(fresh(),o);cur=S.step||"learn";return true;}catch(e){return false;}}
function cert(){
  const nm=($("#nm")&&$("#nm").value.trim())||"";
  if(!nm){toast("Type your name first.");$("#nm")&&$("#nm").focus();return;}
  S.name=nm;const d=new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
  $("#cert").innerHTML=`<div class="cert-card" role="dialog" aria-label="Certificate"><div style="font-size:2.8rem">🏆</div>
   <h2>Certificate of Achievement</h2><p>This certifies that</p><div class="who">${esc(nm)}</div>
   <p>has completed<br><b>IELTS Writing Task 2: Idea Builder</b><br>Both sides brainstormed and two body paragraphs written · Activities: ${pct()}%</p>
   <p>Date: ${d}</p><p class="small">Designed by: Nazila Motahari</p>
   <div class="cert-actions"><button class="btn" data-act="print">Print</button><button class="btn ghost" data-act="closecert">Close</button></div></div>`;
  $("#cert").hidden=false;confetti(200);}
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),3000);}
const cv=$("#confetti"),cx=cv.getContext("2d");let parts=[],running=false;
function confetti(n){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  cv.width=innerWidth;cv.height=innerHeight;
  const cs=getComputedStyle(document.documentElement),cols=[cs.getPropertyValue("--a"),"#1c1c1c","#ffe066","#5a5a5a","#ffffff"];
  for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*12-4,s:Math.random()*7+4,r:Math.random()*6,c:cols[i%cols.length].trim(),l:120});
  if(!running){running=true;requestAnimationFrame(tick);}}
function tick(){cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.1;p.l--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore();});
  parts=parts.filter(p=>p.l>0&&p.y<cv.height+20);
  if(parts.length)requestAnimationFrame(tick);else{running=false;cx.clearRect(0,0,cv.width,cv.height);}}
if(load()){render();setTimeout(()=>toast("Welcome back. Your work was restored."),400);}else render();
</script></body></html>
